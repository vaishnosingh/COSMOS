<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes typeLine1 {
        0%, 10% { opacity: 0; }
        15%, 100% { opacity: 1; }
      }
      @keyframes typeLine2 {
        0%, 30% { opacity: 0; }
        35%, 100% { opacity: 1; }
      }
      @keyframes typeLine3 {
        0%, 50% { opacity: 0; }
        55%, 100% { opacity: 1; }
      }
      @keyframes typeLine4 {
        0%, 70% { opacity: 0; }
        75%, 100% { opacity: 1; }
      }

      .cursor { animation: blinkCursor 0.9s infinite; }
      .term-text { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 13px; }
      .step1 { animation: typeLine1 10s infinite; }
      .step2 { animation: typeLine2 10s infinite; }
      .step3 { animation: typeLine3 10s infinite; }
      .step4 { animation: typeLine4 10s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="100%" height="100%" fill="url(#termGrad)" rx="12" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>

  <!-- Top Bar -->
  <rect width="100%" height="38" fill="rgba(15,23,42,0.9)" rx="12"/>
  <rect y="26" width="100%" height="12" fill="rgba(15,23,42,0.9)"/>
  <line x1="0" y1="38" x2="920" y2="38" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>

  <!-- Title -->
  <text x="460" y="23" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="0.08em">
    user@cosmos-workstation:~ (bash)
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(32, 70)" class="term-text">
    <!-- Command 1 -->
    <g class="step1">
      <text x="0" y="0" fill="#38bdf8" font-weight="600">$</text>
      <text x="18" y="0" fill="#f8fafc">git clone https://github.com/vaishnosingh/COSMOS.git &amp;&amp; cd COSMOS/deploy</text>
    </g>

    <!-- Command 2 -->
    <g transform="translate(0, 32)" class="step2">
      <text x="0" y="0" fill="#38bdf8" font-weight="600">$</text>
      <text x="18" y="0" fill="#f8fafc">docker-compose up -d</text>
    </g>

    <!-- Execution Output -->
    <g transform="translate(0, 68)" class="step3">
      <text x="0" y="0" fill="#10b981">✔</text>
      <text x="22" y="0" fill="#94a3b8">Network cosmos_net</text>
      <text x="320" y="0" fill="#64748b">Created</text>

      <text x="0" y="24" fill="#10b981">✔</text>
      <text x="22" y="24" fill="#94a3b8">Container cosmos-scylla</text>
      <text x="320" y="24" fill="#34d399">Healthy (:9042)</text>

      <text x="0" y="48" fill="#10b981">✔</text>
      <text x="22" y="48" fill="#94a3b8">Container cosmos-minio</text>
      <text x="320" y="48" fill="#38bdf8">Healthy (:9000/:9001)</text>

      <text x="0" y="72" fill="#10b981">✔</text>
      <text x="22" y="72" fill="#94a3b8">Container cosmos-gitea</text>
      <text x="320" y="72" fill="#c084fc">Healthy (:3000)</text>

      <text x="0" y="96" fill="#10b981">✔</text>
      <text x="22" y="96" fill="#94a3b8">Container cosmos-core</text>
      <text x="320" y="96" fill="#f8fafc" font-weight="600">Running on http://localhost:8080</text>
    </g>

    <!-- Prompt with blinking cursor -->
    <g transform="translate(0, 204)" class="step4">
      <text x="0" y="0" fill="#38bdf8" font-weight="600">$</text>
      <text x="18" y="0" fill="#34d399" font-weight="600">cosmos-cli status</text>
      <text x="175" y="0" fill="#94a3b8">--all</text>
      <text x="235" y="0" fill="#f8fafc" font-weight="600">[WORKSTATION READY]</text>
      <rect x="420" y="-12" width="8" height="15" fill="#38bdf8" class="cursor"/>
    </g>
  </g>
</svg>
