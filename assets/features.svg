<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <radialGradient id="featNebula" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes neonPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .neon-border { animation: neonPulse 3s ease-in-out infinite; }
      .float-card { animation: floatSlow 4s ease-in-out infinite; }
      .card-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; font-size: 13px; }
      .mono-txt { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; }
    </style>
  </defs>

  <!-- Deep Canvas -->
  <rect width="100%" height="100%" fill="#020308" rx="14"/>
  <rect width="100%" height="100%" fill="url(#featNebula)" rx="14"/>

  <!-- Card 1: S3 Storage (Cyan Theme) -->
  <g transform="translate(20, 20)">
    <rect width="205" height="200" rx="12" fill="url(#cardGradDark)" stroke="rgba(56,189,248,0.4)" stroke-width="1.2" class="neon-border"/>
    <!-- Header Icon Pill -->
    <g transform="translate(16, 16)">
      <rect width="36" height="36" rx="8" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <circle cx="18" cy="18" r="7" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <circle cx="18" cy="18" r="2.5" fill="#38bdf8"/>
    </g>
    <!-- Text -->
    <text x="62" y="32" fill="#f8fafc" class="card-title">Oort S3 Storage</text>
    <text x="62" y="46" fill="#38bdf8" class="mono-txt">MINIO ENGINE</text>
    <line x1="16" y1="64" x2="189" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="86" fill="#cbd5e1" class="mono-txt">• Full S3 Compatibility</text>
    <text x="16" y="106" fill="#94a3b8" class="mono-txt">• Automated IAM Isolation</text>
    <text x="16" y="126" fill="#94a3b8" class="mono-txt">• Object Versioning</text>
    <text x="16" y="146" fill="#94a3b8" class="mono-txt">• Presigned Share URLs</text>
    <text x="16" y="166" fill="#94a3b8" class="mono-txt">• Capacity Quotas</text>
    <!-- Footer Tag -->
    <rect x="16" y="176" width="76" height="16" rx="8" fill="rgba(56,189,248,0.15)"/>
    <text x="54" y="187.5" fill="#38bdf8" class="mono-txt" font-size="8" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Card 2: Git Forge (Purple Theme) -->
  <g transform="translate(245, 20)">
    <rect width="205" height="200" rx="12" fill="url(#cardGradDark)" stroke="rgba(192,132,252,0.4)" stroke-width="1.2" class="neon-border"/>
    <!-- Header Icon Pill -->
    <g transform="translate(16, 16)">
      <rect width="36" height="36" rx="8" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#c084fc"/>
      <circle cx="22" cy="22" r="3" fill="#c084fc"/>
      <path d="M 14,17 L 14,24 A 4,4 0 0,0 18,28 L 22,25" fill="none" stroke="#c084fc" stroke-width="1.4"/>
    </g>
    <!-- Text -->
    <text x="62" y="32" fill="#f8fafc" class="card-title">Source Forge</text>
    <text x="62" y="46" fill="#c084fc" class="mono-txt">GITEA ENGINE</text>
    <line x1="16" y1="64" x2="189" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="86" fill="#cbd5e1" class="mono-txt">• Private Git Repos</text>
    <text x="16" y="106" fill="#94a3b8" class="mono-txt">• SSO Password Sync</text>
    <text x="16" y="126" fill="#94a3b8" class="mono-txt">• Auto-Healing Auth</text>
    <text x="16" y="146" fill="#94a3b8" class="mono-txt">• SSH &amp; HTTPS Clones</text>
    <text x="16" y="166" fill="#94a3b8" class="mono-txt">• Code Collaboration</text>
    <!-- Footer Tag -->
    <rect x="16" y="176" width="76" height="16" rx="8" fill="rgba(192,132,252,0.15)"/>
    <text x="54" y="187.5" fill="#c084fc" class="mono-txt" font-size="8" text-anchor="middle">SYNCED</text>
  </g>

  <!-- Card 3: Edge CDN (Emerald Theme) -->
  <g transform="translate(470, 20)">
    <rect width="205" height="200" rx="12" fill="url(#cardGradDark)" stroke="rgba(52,211,153,0.4)" stroke-width="1.2" class="neon-border"/>
    <!-- Header Icon Pill -->
    <g transform="translate(16, 16)">
      <rect width="36" height="36" rx="8" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
      <path d="M 22,12 L 13,21 L 18,21 L 14,26 L 24,17 L 19,17 Z" fill="#34d399"/>
    </g>
    <!-- Text -->
    <text x="62" y="32" fill="#f8fafc" class="card-title">Edge CDN Layer</text>
    <text x="62" y="46" fill="#34d399" class="mono-txt">IN-MEMORY CACHE</text>
    <line x1="16" y1="64" x2="189" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="86" fill="#cbd5e1" class="mono-txt">• Sub-millisecond TTL</text>
    <text x="16" y="106" fill="#94a3b8" class="mono-txt">• ETag Validation</text>
    <text x="16" y="126" fill="#94a3b8" class="mono-txt">• Vanity CNAME Domains</text>
    <text x="16" y="146" fill="#94a3b8" class="mono-txt">• Automatic Invalidation</text>
    <text x="16" y="166" fill="#94a3b8" class="mono-txt">• Zero Origin Bottlenecks</text>
    <!-- Footer Tag -->
    <rect x="16" y="176" width="76" height="16" rx="8" fill="rgba(52,211,153,0.15)"/>
    <text x="54" y="187.5" fill="#34d399" class="mono-txt" font-size="8" text-anchor="middle">&lt; 1ms RT</text>
  </g>

  <!-- Card 4: 3D Observability (Amber/Gold Theme) -->
  <g transform="translate(695, 20)">
    <rect width="205" height="200" rx="12" fill="url(#cardGradDark)" stroke="rgba(251,191,36,0.4)" stroke-width="1.2" class="neon-border"/>
    <!-- Header Icon Pill -->
    <g transform="translate(16, 16)">
      <rect width="36" height="36" rx="8" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
      <ellipse cx="18" cy="18" rx="8" ry="4" fill="none" stroke="#fbbf24" stroke-width="1.4" transform="rotate(-20 18 18)"/>
      <circle cx="18" cy="18" r="5" fill="#fbbf24" opacity="0.8"/>
    </g>
    <!-- Text -->
    <text x="62" y="32" fill="#f8fafc" class="card-title">3D Telemetry</text>
    <text x="62" y="46" fill="#fbbf24" class="mono-txt">SCYLLA ANALYTICS</text>
    <line x1="16" y1="64" x2="189" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="86" fill="#cbd5e1" class="mono-txt">• Orthographic 3D Globe</text>
    <text x="16" y="106" fill="#94a3b8" class="mono-txt">• Live Request Ratios</text>
    <text x="16" y="126" fill="#94a3b8" class="mono-txt">• Cache Hit / Miss Gauges</text>
    <text x="16" y="146" fill="#94a3b8" class="mono-txt">• Hourly Bandwidth</text>
    <text x="16" y="166" fill="#94a3b8" class="mono-txt">• Granular Error Logs</text>
    <!-- Footer Tag -->
    <rect x="16" y="176" width="76" height="16" rx="8" fill="rgba(251,191,36,0.15)"/>
    <text x="54" y="187.5" fill="#fbbf24" class="mono-txt" font-size="8" text-anchor="middle">REALTIME</text>
  </g>
</svg>
